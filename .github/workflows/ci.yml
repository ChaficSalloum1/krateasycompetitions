name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CP-SAT solver dependency
        run: pip install -r packages/competition-engine/solver/requirements-cp-sat.txt -c packages/competition-engine/solver/constraints-cp-sat.txt

      - name: Install dependencies
        run: npm ci

      - name: Whitespace check on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git diff --check "$BASE_SHA" HEAD

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Equivalent to `npm run check` (tsc -b, then the full suite), with a JUnit report kept as evidence.
      - name: Type-check and build
        run: npm run build

      - name: Test
        run: |
          mkdir -p evidence
          npm run test:ci

      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser:ci

      - name: Protocol model check
        shell: bash
        run: npm run --silent stress:protocols | tee evidence/protocol-model-check.json

      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-evidence
          path: evidence/
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build production image
        run: docker build -f deployment/Dockerfile -t krateasy:ci .

      - name: Production host starts from the pruned image and fails closed without configuration
        env:
          SMOKE_IMAGE: krateasy:ci
        shell: bash
        run: |
          mkdir -p evidence
          node scripts/smoke-production-host.mjs | tee evidence/container-smoke.txt
          docker image inspect krateasy:ci --format '{{json .}}' > evidence/image-inspect.json

      - name: Keep container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence
          path: evidence/
          if-no-files-found: error

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift client tests
        run: npm run check:apple

  postgres-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Postgres event store against a real server
        env:
          TOURNAMENTOS_POSTGRES_HOST: 127.0.0.1
          TOURNAMENTOS_POSTGRES_PORT: "5432"
          USER: postgres
        run: node --import tsx scripts/verify-postgres-event-store.ts

      - name: Verify Postgres production coordination against a real server
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          COORDINATION_KEY_HASH_SECRET: ci-only-coordination-key-hash-secret-not-a-real-secret-32b
        run: node --import tsx scripts/verify-postgres-production-coordination.ts
