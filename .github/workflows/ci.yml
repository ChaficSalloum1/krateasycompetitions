name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CP-SAT solver dependency
        run: pip install -r packages/competition-engine/solver/requirements-cp-sat.txt

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Protocol model check
        run: npm run stress:protocols
